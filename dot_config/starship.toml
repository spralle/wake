# Starship prompt config — cross-platform (zsh + PowerShell)
# Docs: https://starship.rs/config/

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$python\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold yellow"

[nodejs]
format = "[$symbol($version)]($style) "
symbol = " "
detect_files = ["package.json"]

[rust]
format = "[$symbol($version)]($style) "
symbol = " "

[python]
format = "[$symbol($version)]($style) "
symbol = " "

[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "bold yellow"

[username]
show_always = false

[hostname]
ssh_only = true
